FEATURES {
    STARTADDRESS: default = $0801;
}

SYMBOLS {
    __STACKSIZE__: type = weak, value = $0100;
}

MEMORY {
    ZP:        start = $0002, size = $001A, type = rw, define = yes;
    LOADADDR:  start = $0000, size = $0002, file = %O;
    LOW:       start = $0801, size = $0FFF, file = %O, fill = yes;
    TUNE:      start = $1800, size = $4800, file = %O, fill = yes;
    CODEMEM:   start = $6000, size = $2000, file = %O, fill = yes;
    RODATAMEM: start = $8000, size = $3000, file = %O;
    BSSRAM:    start = $2600, size = $1A00, type = rw, define = yes;
}

SEGMENTS {
    LOADADDR: load = LOADADDR,  type = ro;
    ZEROPAGE: load = ZP,        type = zp;
    BASIC:    load = LOW,       type = ro, start = $0801;
    STARTUP:  load = LOW,       type = ro;
    SIDTUNE:  load = TUNE,      type = ro, start = $1800;
    CODE2:    load = TUNE,      type = ro, start = $5500;
    CODE3:    load = TUNE,      type = ro, start = $5800;
    CODE:     load = CODEMEM,   type = ro;
    RODATA:   load = RODATAMEM, type = ro;
    DATA:     load = RODATAMEM, type = rw;
    BSS:      load = BSSRAM,    type = bss, define = yes;
}
